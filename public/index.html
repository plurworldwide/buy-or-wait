<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buy or Wait?</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root { --ink:#111; --muted:#555; --line:#ddd; --bg:#fff; --soft:#f5f5f4; --green:#0a7a3e; --green-bg:#e6f4ec; --amber:#9a5b00; --amber-bg:#fff3dc; --blue:#0b57d0; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  main { max-width:720px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:28px; margin:8px 0 4px; letter-spacing:-.02em; }
  h2 { font-size:18px; margin:32px 0 10px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  a { color:var(--blue); }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input { flex:1 1 240px; font:inherit; padding:12px 14px; border:2px solid var(--ink); border-radius:10px; }
  button { font:inherit; font-weight:600; padding:12px 18px; border:0; border-radius:10px; background:var(--ink); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.secondary { background:var(--soft); color:var(--ink); border:1px solid var(--line); }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .chip { background:var(--soft); color:var(--ink); border:1px solid var(--line); font-weight:500; padding:6px 12px; border-radius:999px; font-size:14px; }
  .msg { margin-top:16px; padding:12px 14px; border-radius:10px; background:var(--soft); }
  .hidden { display:none !important; }
  .cards { display:grid; gap:10px; margin-top:16px; }
  .card { display:flex; gap:12px; align-items:center; text-align:left; width:100%; background:#fff; color:var(--ink); border:1px solid var(--line); padding:10px; }
  .card:hover { border-color:var(--ink); }
  .card img { width:64px; height:64px; object-fit:contain; flex:none; }
  .card .name { font-weight:600; }
  .card .variant { color:var(--muted); font-size:14px; font-weight:400; }
  .card .price { margin-left:auto; font-weight:700; white-space:nowrap; }
  .steps { list-style:none; padding:0; margin:20px 0; }
  .steps li { padding:8px 0; color:var(--muted); }
  .steps li::before { content:"○"; display:inline-block; width:24px; }
  .steps li.active { color:var(--ink); font-weight:600; }
  .steps li.active::before { content:"◌"; }
  .steps li.done { color:var(--ink); }
  .steps li.done::before { content:"✓"; color:var(--green); font-weight:700; }
  .product { display:flex; gap:12px; align-items:center; margin-top:8px; }
  .product img { width:72px; height:72px; object-fit:contain; }
  .big { font-size:44px; font-weight:800; letter-spacing:-.02em; line-height:1.1; }
  .verdict { margin-top:16px; padding:16px; border-radius:12px; border-left:6px solid; }
  .verdict.BUY_NOW { background:var(--green-bg); border-color:var(--green); }
  .verdict.WAIT { background:var(--amber-bg); border-color:var(--amber); }
  .verdict.UNKNOWN { background:var(--soft); border-color:var(--muted); }
  .verdict .label { font-size:22px; font-weight:800; }
  .verdict.BUY_NOW .label { color:var(--green); }
  .verdict.WAIT .label { color:var(--amber); }
  .verdict p { margin:6px 0 0; }
  .tip { font-weight:600; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px; }
  .stat { background:var(--soft); border-radius:10px; padding:10px; }
  .stat b { display:block; font-size:20px; }
  .stat span { color:var(--muted); font-size:13px; }
  .chartbox { position:relative; height:240px; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:13px; color:var(--muted); font-weight:600; }
  td.num, th.num { text-align:right; white-space:nowrap; }
  tr.highlight td { background:var(--green-bg); font-weight:600; }
  .neg { color:var(--green); } .pos { color:var(--amber); }
  .note { color:var(--muted); font-size:14px; margin-top:8px; }
  .notes { margin:12px 0 0; padding:10px 14px 10px 32px; border-radius:10px; background:var(--soft); color:#5c3a00; font-size:14px; }
  .notes li { margin:2px 0; }
  .muted { color:var(--muted); }
  @media (max-width:520px) {
    main { padding:16px 12px 48px; }
    h1 { font-size:24px; }
    .big { font-size:38px; }
    .stat b { font-size:16px; }
    .stat { padding:8px; }
    table { font-size:14px; }
    th, td { padding:8px 4px; }
    .card img { width:48px; height:48px; }
    form button { width:100%; }
  }
  .scroll { overflow-x:auto; }
  footer { margin-top:32px; }
</style>
</head>
<body>
<main>
  <h1>Buy or Wait?</h1>
  <p class="sub">Best price on idealo, whether it's a good one, and where in Europe it's cheaper.</p>

  <!-- 1. Search -->
  <section id="search">
    <form id="form">
      <input id="q" placeholder="What are you about to buy?" autocomplete="off" required>
      <button id="go">Find best price</button>
    </form>
    <div class="chips">
      <button class="chip" type="button">Sony WH-1000XM5</button>
      <button class="chip" type="button">iPhone 16 128GB</button>
      <button class="chip" type="button">Dyson V15</button>
    </div>
    <div id="searchMsg" class="msg hidden"></div>
    <!-- 2. Pick -->
    <div id="cards" class="cards"></div>
  </section>

  <!-- 3. Working -->
  <section id="working" class="hidden">
    <ul class="steps" id="steps">
      <li>Found product on idealo</li>
      <li>Checked shops</li>
      <li>Read 30-day price history</li>
      <li>Compared 6 countries</li>
    </ul>
  </section>

  <!-- 4. Result -->
  <section id="result" class="hidden"></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const eur = (n) => n == null ? "–" : n.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const day = (iso) => iso ? new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : "";
const COUNTRY = { DE: "🇩🇪 Germany", AT: "🇦🇹 Austria", FR: "🇫🇷 France", IT: "🇮🇹 Italy", ES: "🇪🇸 Spain", GB: "🇬🇧 United Kingdom" };
let chart;

function show(section) {
  for (const id of ["search", "working", "result"]) $(id).classList.toggle("hidden", id !== section);
}

// ---------- 1. Search ----------
document.querySelectorAll(".chip").forEach((b) => b.onclick = () => { $("q").value = b.textContent; search(); });
$("form").onsubmit = (e) => { e.preventDefault(); search(); };

async function search() {
  const q = $("q").value.trim();
  if (!q) return;
  $("go").disabled = true; $("go").textContent = "Searching…";
  $("cards").innerHTML = ""; $("searchMsg").classList.add("hidden");
  try {
    const r = await fetch("/api/search?q=" + encodeURIComponent(q)).then((r) => r.json());
    if (r.error) return message(r.error);
    if (!r.results.length) return message(r.message || "No match on idealo. Try the exact model name.");
    if (r.results.length === 1) return check(r.results[0]);
    // ---------- 2. Pick ----------
    $("cards").innerHTML = r.results.map((p, i) => `
      <button class="card" data-i="${i}">
        ${p.imageUrl ? `<img src="${esc(p.imageUrl)}" alt="">` : ""}
        <div><div class="name">${esc(p.name)}</div><div class="variant">${esc(p.variant)}</div></div>
        <div class="price">${p.price != null ? "from " + eur(p.price) : ""}</div>
      </button>`).join("");
    $("cards").querySelectorAll(".card").forEach((c) => c.onclick = () => check(r.results[c.dataset.i]));
  } catch {
    message("Couldn't reach the server. Please try again.");
  } finally {
    $("go").disabled = false; $("go").textContent = "Find best price";
  }
}
function message(t) { $("searchMsg").textContent = t; $("searchMsg").classList.remove("hidden"); }

// ---------- 3. Working ----------
async function check(p) {
  show("working");
  const steps = [...$("steps").children];
  steps.forEach((li) => li.className = "");
  steps[0].className = "done";
  let i = 1; steps[i].className = "active";
  // The server does all steps in one go; tick them while we wait, finish when the answer arrives.
  const timer = setInterval(() => { if (i < steps.length - 1) { steps[i].className = "done"; steps[++i].className = "active"; } }, 900);
  try {
    const res = await fetch("/api/check?productRef=" + encodeURIComponent(p.productRef));
    const data = await res.json();
    clearInterval(timer);
    if (data.error) { show("search"); return message(data.error); }
    steps.forEach((li) => li.className = "done");
    await new Promise((r) => setTimeout(r, 300));
    render(data);
  } catch {
    clearInterval(timer); show("search"); message("Couldn't reach the server. Please try again.");
  }
}

// ---------- 4. Result ----------
function render(d) {
  const p = d.prices, prod = d.product;
  const label = { BUY_NOW: "BUY NOW", WAIT: "WAIT", UNKNOWN: "NOT SURE" }[d.verdict];
  const de = d.europe.find((e) => e.country === "DE");
  $("result").innerHTML = `
    <div class="product">
      ${prod.imageUrl ? `<img src="${esc(prod.imageUrl)}" alt="">` : ""}
      <div><b>${esc(prod.name)}</b><br><span class="variant">${esc(prod.variant)}</span>
      ${prod.idealoUrl ? `<br><a href="${esc(prod.idealoUrl)}" target="_blank" rel="noopener">View on idealo</a>` : ""}</div>
    </div>

    <h2>Best price today</h2>
    ${p.todayBest != null ? `
      <div class="big">${eur(p.todayBest)}</div>
      <div>at <b>${esc(p.todayBestShop)}</b> · <a href="${esc(p.todayBestUrl)}" target="_blank" rel="noopener">Go to shop →</a></div>`
      : `<div>No shop prices available right now.</div>`}

    <div class="verdict ${d.verdict}">
      <div class="label">${label}</div>
      ${d.reason ? `<p>${esc(d.reason)}</p>` : `<p>Not enough price history to judge this price.</p>`}
      ${d.tip ? `<p class="tip">💡 ${esc(d.tip)}</p>` : ""}
    </div>
    ${d.dataNotes.length ? `<ul class="notes">${d.dataNotes.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}

    <div class="stats">
      <div class="stat"><b>${eur(p.todayBest)}</b><span>Today's best</span></div>
      <div class="stat"><b>${eur(p.min30)}</b><span>30-day low${p.lowestDate ? " · " + day(p.lowestDate) : ""}</span></div>
      <div class="stat"><b>${eur(p.avg30)}</b><span>30-day average</span></div>
    </div>

    ${d.history.length ? `<h2>Last 30 days in Germany</h2><div class="chartbox"><canvas id="chart"></canvas></div>` : ""}

    <h2>Top shops in Germany</h2>
    ${d.shopsDE.length ? `<div class="scroll"><table>
      <tr><th>Shop</th><th class="num">Price</th><th class="num">Shipping</th><th class="hide-sm">Delivery</th><th></th></tr>
      ${d.shopsDE.map((s) => `<tr>
        <td>${esc(s.shop)}</td><td class="num"><b>${eur(s.price)}</b></td>
        <td class="num">${s.shipping == null ? "–" : s.shipping === 0 ? "Free" : eur(s.shipping)}</td>
        <td class="hide-sm">${esc(s.delivery)}</td>
        <td><a href="${esc(s.url)}" target="_blank" rel="noopener">Buy</a></td></tr>`).join("")}
    </table></div>` : `<p>No shop offers available right now.</p>`}

    <h2>Cheaper elsewhere in Europe?</h2>
    <div class="scroll"><table>
      <tr><th>Country</th><th class="num">Best price</th><th class="num">vs Germany</th><th></th></tr>
      ${d.europe.map((e) => `<tr class="${e.country === d.cheapestCountry ? "highlight" : ""}">
        <td>${COUNTRY[e.country] || e.country}</td>
        <td class="num">${e.available ? (e.approx ? "approx. " : "") + eur(e.priceEUR) : `<span class="muted">${e.noAnswer ? "No answer from idealo" : "Not available"}</span>`}</td>
        <td class="num">${e.country === "DE" ? "–" : e.diffVsDE == null ? "" :
          `<span class="${e.diffVsDE < 0 ? "neg" : "pos"}">${e.diffVsDE > 0 ? "+" : ""}${e.diffVsDE.toFixed(1)}%</span>`}</td>
        <td>${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">View</a>` : ""}</td></tr>`).join("")}
    </table></div>
    <p class="note">Check shipping to Germany, warranty and plug type. UK prices converted at 1 £ = 1.17 € (approx.).</p>

    <footer><button class="secondary" id="again">Check another product</button></footer>`;

  $("again").onclick = () => { $("q").value = ""; $("cards").innerHTML = ""; show("search"); $("q").focus(); };
  show("result");
  window.scrollTo(0, 0);
  if (d.history.length) drawChart(d.history, p.min30);
}

function drawChart(history, min) {
  if (chart) chart.destroy();
  const lowIdx = history.findIndex((h) => h.price === min);
  chart = new Chart($("chart"), {
    type: "line",
    data: {
      labels: history.map((h) => day(h.date)),
      datasets: [
        { label: "Lowest price", data: history.map((h) => h.price), borderColor: "#111", borderWidth: 2, tension: 0,
          pointRadius: history.map((_, i) => i === lowIdx ? 6 : 0),
          pointBackgroundColor: "#0a7a3e", pointBorderColor: "#0a7a3e" },
        { label: "30-day low", data: history.map(() => min), borderColor: "#0a7a3e", borderDash: [6, 4], borderWidth: 1.5, pointRadius: 0 },
      ],
    },
    options: {
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { labels: { boxWidth: 14 } },
        tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${eur(c.parsed.y)}` } },
      },
      scales: { y: { ticks: { callback: (v) => v + " €" } }, x: { ticks: { maxTicksLimit: 6 } } },
    },
  });
}
</script>
</body>
</html>
